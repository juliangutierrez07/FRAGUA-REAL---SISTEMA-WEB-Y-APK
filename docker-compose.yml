services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - fragua-db
    expose:
      - "80"
    environment:
      APP_NAME: "Fragua Real Burger"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://fraguareal.juliangutierrez.online
      FRONTEND_URL: https://fraguareal.juliangutierrez.online
      APP_LOCALE: es
      LOG_CHANNEL: stack
      LOG_STACK: daily
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: fragua-db
      DB_PORT: "5432"
      DB_DATABASE: fragua_real
      DB_USERNAME: fragua
      DB_PASSWORD: ${DB_PASSWORD:-FraguaReal_Db_2026}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      # Correo: los valores reales (y la contraseña) se ponen en Dokploy > Environment.
      # Sin ellos, los correos quedan en el log y no se envían.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
      MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: "Fragua Real Burger"
      PASARELA_PROVEEDOR: manual
      CORS_ORIGENES: ""
    volumes:
      - fragua_storage:/var/www/backend/storage

  fragua-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fragua_real
      POSTGRES_USER: fragua
      POSTGRES_PASSWORD: ${DB_PASSWORD:-FraguaReal_Db_2026}
    volumes:
      - fragua_db:/var/lib/postgresql/data

volumes:
  fragua_storage:
  fragua_db:
